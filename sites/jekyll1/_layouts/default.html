<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand">
          <strong>Paper & Ink Preview</strong>
          <small>Jekyll Portfolio / Vol. I</small>
        </div>
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">Abstract</a>
          <a href="{{ '/publication/' | relative_url }}">Publications</a>
          <a href="{{ '/experience/' | relative_url }}">Experience</a>
          <a href="{{ '/blog/' | relative_url }}">Notes</a>
        </nav>
      </header>

      {{ content }}

      <footer class="footer">
        <div>
          <strong>Aritra Bandyopadhyay</strong>
          <div class="meta">Printed via Jekyll / `/jekyll1/`.</div>
        </div>
        <div class="nav">
          <a href="/">Index</a>
          <a href="/media/resume.pdf">Curriculum Vitae</a>
        </div>
      </footer>
    </main>
  </body>
</html>
