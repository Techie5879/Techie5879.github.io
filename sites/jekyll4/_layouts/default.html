<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <strong>Aritra Bandyopadhyay</strong>
          <small>The Archival Index</small>
        </div>
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">Catalogue</a>
          <a href="{{ '/publication/' | relative_url }}">Records</a>
          <a href="{{ '/experience/' | relative_url }}">History</a>
          <a href="{{ '/blog/' | relative_url }}">Journals</a>
        </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="footer">
        <p>&copy; Aritra Bandyopadhyay. Archived via Jekyll.</p>
        <div>
          <a href="/">Global Index</a>
          <a href="/media/resume.pdf">Full Dossier</a>
        </div>
      </footer>
    </div>
  </body>
</html>
