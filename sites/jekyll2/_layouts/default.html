<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand">
          <strong>Geometric</strong>
          <small>Jekyll Portfolio / Vol. II</small>
        </div>
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/publication/' | relative_url }}">Pubs</a>
          <a href="{{ '/experience/' | relative_url }}">Exp</a>
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
        </nav>
      </header>

      {{ content }}

      <footer class="footer">
        <div>
          <strong>Aritra Bandyopadhyay</strong>
          <div class="meta">Bauhaus-inspired Jekyll Layout</div>
        </div>
        <div class="nav" style="display: flex; gap: 16px;">
          <a href="/">Chooser</a>
          <a href="/media/resume.pdf">Resume</a>
        </div>
      </footer>
    </main>
  </body>
</html>
