<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div class="brand">
          <strong>Aritra Bandyopadhyay</strong>
          <small>Lab Bench // Jekyll</small>
        </div>
        <nav class="nav">
          <a href="{{ '/' | relative_url }}">Overview</a>
          <a href="{{ '/publication/' | relative_url }}">Research</a>
          <a href="{{ '/experience/' | relative_url }}">Experience</a>
          <a href="{{ '/blog/' | relative_url }}">Notes</a>
        </nav>
      </header>

      <main class="content-area">
        {{ content }}

        <footer class="footer">
          <div>
            <strong>Aritra Bandyopadhyay</strong>
            <div class="meta">Compiled with Jekyll.</div>
          </div>
          <div class="nav" style="flex-direction: row;">
            <a href="/">Chooser</a>
            <a href="/media/resume.pdf">Resume</a>
          </div>
        </footer>
      </main>
    </div>
  </body>
</html>
